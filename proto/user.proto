syntax = "proto3";

// user 领域: 模型与各层出入参.
package webserver.user;

// ---- 模型 ----

// 表镜像 (含密文), 仅 service 内部使用.
message User {
  uint64 vid = 1;
  string username = 2;
  string password = 3;
}

message UserList {
  repeated User userlist = 1;
}

message UserInfo {
  uint64 vid = 1;
  string username = 2;
}

message InsertUserReq {
  uint64 vid = 1;           // 业务生成, 避开 0.
  string username = 2;
  string password_hash = 3; // bcrypt 密文.
}
message InsertUserRsp {} // 预留: insert_id 等.

message QueryByUsernameReq {
  string username = 1;
}
message QueryByUsernameRsp {
  uint64 vid = 1;
  string username = 2;
  string password_hash = 3;
}

message QueryByVidReq {
  uint64 vid = 1;
}
message QueryByVidRsp {
  uint64 vid = 1;
  string username = 2;
}

message UpdatePasswordReq {
  uint64 vid = 1;
  string password_hash = 2; // 新密文 (bcrypt).
}
message UpdatePasswordRsp {}

// ---- service 出入参 (返回码: 0 成功 / >0 业务失败 / -1 不可重试 / -2 可重试) ----

message RegisterReq {
  // 契约 (单一文档源, 前后端规则一致; 前端仅 UX 预校验, 后端为权威防线):
  //   username: 3-64 字节, 白名单 [A-Za-z0-9_-] (拒中文/emoji/符号/
  //             空白/控制字符: 根除同形仿冒与注入面; 白名单皆单字节,
  //             字节数即字符数)
  //   password: 8-64 字节 (上限 64 < bcrypt 72 字节截断线);
  //             拒控制字符/首尾空白/含用户名/弱密码黑名单;
  //             不强制组合规则 (NIST 800-63B); 长度按 UTF-8 字节计.
  string username = 1;
  string password = 2; // 明文 (传输安全由 HTTPS 保证, 加密在 service).
}
message RegisterRsp {
  uint64 vid = 1;
  string username = 2;
}

message LoginReq {
  string username = 1;
  string password = 2; // 明文 (传输安全由 HTTPS 保证, 校验在 service).
}
message LoginRsp {
  uint64 vid = 1;
  string username = 2;
}

// ---- controller 对外 (HTTP 响应体, Http 前缀区分于 service 层消息) ----

// /register POST 响应.
message HttpRegisterRsp {
  int32 code = 1;     // 0 成功; 400 参数非法 (含"密码过于简单");
                      // 409 用户名已被占用; 403 CSRF 校验失败; 500 系统错误.
  string msg = 2;
  uint64 vid = 3;
  string username = 4;
}

// /login POST 响应; 凭证错误统一文案, 防用户名枚举.
message HttpLoginRsp {
  int32 code = 1;     // 0 成功; 401 凭证错误; 403 CSRF 校验失败; 500 系统错误.
  string msg = 2;
  uint64 vid = 3;
  string username = 4;
}

// /logout POST 响应.
message HttpLogoutRsp {
  int32 code = 1; // 0 成功; 403 CSRF 校验失败; 500 系统错误.
  string msg = 2;
}

// /api/csrf GET 响应.
message HttpCsrfRsp {
  string csrf_token = 1;
}

// /api/me GET 响应; 仅返回 welcome 页面需要的当前用户名.
message HttpCurrentUserRsp {
  string username = 1;
}
