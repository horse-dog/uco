syntax = "proto3";

message User {
  string username = 1;
  int32 age = 2;
}

message Address {
  string street = 1;
  string city = 2;
}

message JokeTemplate {
  string name = 1;
  int32 age = 2;
  repeated Address addresses = 3;
}

message TBUser {
  uint64 vid = 1;
  string username = 2;
  string password = 3;
}

message TBUserList {
  repeated TBUser userlist = 1;
}
