syntax = "proto3";

message Address {
  string street = 1;
  string city = 2;
}

message JokeTemplate {
  string name = 1;
  int32 age = 2;
  repeated Address addresses = 3;
}

message User {
  uint64 vid = 1;
  string username = 2;
  string password = 3;
}

message UserList {
  repeated User userlist = 1;
}

// 对外响应模型 (不含 password, 防密文回显);
// User (表镜像, 含密文) 仅供 service 内部使用.
message UserInfo {
  uint64 vid = 1;
  string username = 2;
}
